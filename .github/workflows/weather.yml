name: Weather to Telegram

on:
  schedule:
    - cron: "45 4,5,8,9,12,13,16,17 * * *"
  workflow_dispatch:
    inputs:
      force:
        description: "Надіслати зараз, ігноруючи розклад (для тесту)"
        type: boolean
        default: true

permissions:
  contents: read

jobs:
  send:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@v4
      - name: Send weather
        run: python3 weather.py
        env:
          TG_TOKEN: ${{ secrets.TG_TOKEN }}
          TG_CHAT_ID: ${{ secrets.TG_CHAT_ID }}
          FORCE: ${{ inputs.force }}
